<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Universal Media Downloader</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --error: #f87171;
      --success: #4ade80;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    h1 { margin: 0 0 1.5rem 0; font-size: 1.5rem; text-align: center; }
    .form-group { margin-bottom: 1.2rem; }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    button:hover { background-color: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    #status {
      margin-top: 1rem;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
      word-break: break-word;
    }

    .error { background: rgba(248, 113, 113, 0.1); color: var(--error); border: 1px solid var(--error); }
    .success { background: rgba(74, 222, 128, 0.1); color: var(--success); border: 1px solid var(--success); }
    .info { background: rgba(99, 102, 241, 0.1); color: var(--accent); border: 1px solid var(--accent); }
  </style>
</head>
<body>

  <div class="card">
    <h1>Media Downloader</h1>
    
    <div class="form-group">
      <label for="url">Paste Link</label>
      <input type="url" id="url" placeholder="https://..." required>
    </div>

    <div class="grid">
      <div class="form-group">
        <label for="format">Format</label>
        <select id="format" onchange="toggleQuality()">
          <option value="mp4">MP4 (Video)</option>
          <option value="mp3">MP3 (Audio)</option>
        </select>
      </div>

      <div class="form-group" id="qualityWrapper">
        <label for="quality">Quality</label>
        <select id="quality">
          <option value="max">Best Available</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
        </select>
      </div>
    </div>

    <button id="dlBtn" onclick="startDownload()">Download</button>

    <div id="status"></div>
  </div>

  <script>
    // YOU WILL PASTE YOUR RENDER URL HERE IN STEP 3:
    const RENDER_BACKEND_URL = "https://media-downloader-g74m.onrender.com/";

    function toggleQuality() {
      const fmt = document.getElementById('format').value;
      document.getElementById('qualityWrapper').style.display = (fmt === 'mp3') ? 'none' : 'block';
    }

    function setStatus(msg, type) {
      const status = document.getElementById('status');
      status.style.display = 'block';
      status.className = type;
      status.textContent = msg;
    }

    async function startDownload() {
      const url = document.getElementById('url').value.trim();
      const format = document.getElementById('format').value;
      const quality = document.getElementById('quality').value;
      const btn = document.getElementById('dlBtn');

      if (!url) {
        setStatus('Please paste a link first.', 'error');
        return;
      }

      btn.disabled = true;
      setStatus('Processing on cloud server... Please allow 10-20 seconds.', 'info');

      try {
        const response = await fetch(`${RENDER_BACKEND_URL}/download`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, format, quality })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error || 'Extraction failed.');
        }

        const blob = await response.blob();
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `media_download.${format}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(downloadUrl);

        setStatus('Download complete!', 'success');
      } catch (err) {
        setStatus(`Error: ${err.message}`, 'error');
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
